name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: go vet
        run: go vet ./...
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sonora
          POSTGRES_PASSWORD: sonora
          POSTGRES_DB: sonora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: install migrate CLI
        run: go install github.com/golang-migrate/migrate/v4/cmd/migrate@v4.19.1
      - name: run migrations
        run: migrate -database "$DATABASE_URL" -path internal/db/migrations up
        env:
          DATABASE_URL: postgres://sonora:sonora@localhost:5432/sonora_test?sslmode=disable
      - name: go test
        # -p 1 runs packages sequentially: several _test.go files TRUNCATE
        # the same tables via a shared test database, and parallel packages
        # racing that TRUNCATE against each other's inserts causes flaky
        # foreign-key failures unrelated to the code under test.
        run: go test -race -cover -p 1 ./...
        env:
          SONORA_TEST_DATABASE_URL: postgres://sonora:sonora@localhost:5432/sonora_test?sslmode=disable

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: go build
        run: go build ./...
